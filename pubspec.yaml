name: bharatheeyam
description: "ಭಾರತೀಯಮ್ - Vedic Astrology App"
publish_to: 'none'
version: 2.4.0+77

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  sweph: ^3.2.1+2.10.3
  shared_preferences: any
  google_mobile_ads: any
  share_plus: ^10.0.0
  path_provider: any
  google_sign_in: ^6.2.0
  url_launcher: any
  pdf: ^3.11.3
  printing: ^5.14.2
  table_calendar: ^3.1.3
  package_info_plus: ^8.0.0
  uuid: ^4.5.1
  file_picker: ^10.3.10
  firebase_core: ^4.6.0
  firebase_auth: any
  cloud_firestore: ^6.2.0
  screenshot: ^3.0.0
  device_info_plus: any
  wakelock_plus: ^1.3.3
  timezone: ^0.9.4
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/world_cities.json
  fonts:
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
        - asset: assets/fonts/NotoSansKannada-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-Regular.ttf
        - asset: assets/fonts/NotoSansTelugu-Bold.ttf
          weight: 700
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam-Regular.ttf
        - asset: assets/fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
